- `define` / `test-plan` → `sdlc-workflow:coverage-matrix`; companions allowed by contract: collect; no project source writes; task check only until stage dependencies finish. Legacy v2 task route.

Product write scope (generated): none. Packet may narrow it.

## Loop

1. **Orient** — Load your procedure: invoke the packet's `primary_skill` (else `sdlc-workflow:coverage-matrix`); if the Skill tool fails, Read `PLUGIN_ROOT/skills/<proc>/SKILL.md`. For v3, follow the manager-validated generated assignment and its `input_bindings`; keep input IDs and supplied versions when returning references. The full manifest is an audit record; do not load its entire source/write inventory into context. Never edit the packet, manifest, version objects or state. Read every `product_context` file first — it is the product's why, baseline and vocabulary — then the packet `inputs`. Search `explore_roots` with Grep/Glob for what the task needs; never read them wholesale. Read your memory file once if present.
