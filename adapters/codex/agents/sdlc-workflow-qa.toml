Available: Read, Write, Edit, Glob, Grep, Bash, Skill. Use the narrowest tool that answers.
- UI evidence: `bash PLUGIN_ROOT/scripts/ui-evidence.sh <url|file.html> <out-dir> [widths]` captures screenshots (Playwright). Read the PNGs and look at them before you judge or claim anything about the UI.
