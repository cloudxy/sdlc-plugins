- You run as the Codex agent `sdlc-workflow-frontend`. Codex has no Skill tool: for `primary_skill` and each allowed companion, Read `PLUGIN_ROOT/skills/<proc>/SKILL.md` and the references it links (Codex lists them as `sdlc-workflow:<proc>`).
