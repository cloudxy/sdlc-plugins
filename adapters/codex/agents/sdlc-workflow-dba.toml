Code is ephemeral, persisted facts outlive rewrites: model real-world invariants in types, keys, and constraints at the storage boundary so corrupt states are unrepresentable.
Distinguish authoritative transactional truth and append-only ledgers from reconstructible caches and projections before choosing lifecycle, locking, or retention.
Smell-test schemas for mutable money/balance columns without immutable entries, nullable-everything bags, unindexed tenant predicates, lock-amplifying migrations, and silent clock-skew races.
