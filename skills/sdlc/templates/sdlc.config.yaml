# sdlc.config.yaml 模板——落项目根；换项目只填这个文件（适配层，不进插件）
gates:
  test:      "<定向测试命令>"    # 只测受影响部分，严禁全量跑整个 tests/ 目录（如 uv run pytest -q <受影响测试路径>）
  lint:      "<静态/架构检查>"    # 如 bash scripts/check-arch.sh
  build:     "<构建命令>"        # 如 npm run build -w admin
  migration: "<迁移校验>"        # 如 bash scripts/check-db-migrations.sh；无则 null
  e2e:       "<定向 E2E 命令>"   # 只跑受影响旅程用例，严禁跑全套 E2E（如 npx playwright test <受影响用例>）；ui: yes 时不得为 null
  e2e_reason: ""                 # 仅当项目完全没有用户界面时填写 e2e: null 的理由；scripts/gates/check_config.py 发现 UI 目录会判定矛盾
app:                             # 联调、截图、验收走查用（scripts/ui-evidence.sh 读 base_url）
  start: "<启动命令>"             # 如 docker compose up -d && npm run dev -w web
  base_url: "http://localhost:5173"   # 主界面
  urls:                          # 可选：产品有多个界面，或要探测 API 健康时逐个列出；check_config.py --probe 逐个探测，帽子截图 / 走查 / E2E 按名字取
    # admin: "http://localhost:9112"
    # api: "http://127.0.0.1:9111/api/v1/health"
  widths: [375, 768, 1440]       # 截图断点，与 design-system.md 一致
product_root: docs/product       # 产品层目录（策略/功能地图/增长/设计系统/架构/领域模型/数据）；v4 每个功能都读它并回写
profile:                         # 项目画像与行业路由（见 skills/sdlc/references/routing/industry-playbooks.md）
  # check_config.py 未填时仅打 [推断] profile 提示，不阻断日常局部工作；仅当高风险特征（资金账本/多租户鉴权/AI 上线/合规隐私/不可逆客户端发版）命中未确认画像时在 Step 2 向操作者确认
  industry: ""                   # 9 大标准行业取一：b2b-saas | fintech-ledger | ecommerce-marketplace | consumer-social | ai-agentic | aigc-workbench | data-crawler | regulated-compliance | client-iot-localfirst
  traits: []                     # 可组合横切特征：multi-tenant | payments | ai-enabled | realtime | offline-first | regulated
  surfaces: []                   # 交付表面：web | mobile | desktop | cli | sdk | api | webhook | iot-firmware
  db_engines: []                 # 存储引擎：postgres | mysql | sqlite | clickhouse | redis | vector | object-store
  architecture_style: ""         # 架构形态：modular-monolith | service-oriented | event-driven | serverless | local-first-sync | batch-pipeline
  compliance: []                 # 合规约束：soc2 | pci-dss | gdpr | pipl | hipaa | financial-audit
# signals_path: docs/signals     # 可选：产品级信号库目录（/sdlc-product cycle 用）。只有 ops 的周期信号汇总能写；不能放在 product_root 或 .sdlc 里
imagery:                           # 生成图（Grok 出图）；默认关闭，因为它花你的订阅额度
  enabled: false                   # 只有用户能开；开之前先 /sdlc-grok login 再 /sdlc-grok probe
  provider: grok
  model: grok-imagine-image-2.0    # 以 docs.x.ai 为准，换模型改这里
  auth: auto                       # auto（有订阅凭据就用它，否则用 XAI_API_KEY）| oauth | api-key
  allowed_kinds: [ref, illustration, empty-state, hero, icon]   # 砍掉不想让帽子生成的种类
  defaults:                        # 块式写法：本文件的 YAML 读法不认 {a: b} 这种行内字典
    aspect_ratio: "16:9"
    resolution: "1k"
  budget:
    max_per_feature: 20            # 每个功能最多生成多少张；超了脚本直接拒，由人决定是否调高
research:
  offline: false                 # 只有用户能改成 true（内网 / 断网环境）：调研类产物不再要求网络来源；帽子与经理不得自行设置
constitution: "<项目红线宪法路径>"   # 每帽产出前自检对象
# owners:                          # 可选：按职能写「该问谁」（职能 id 见 skills/sdlc/references/routing/function-map.md）。
#   product-mgmt: <人或团队>       # 只在提问时点名负责人；不授予任何权限，不替代操作者的回答，插件也不会主动联系他们
#   design: <人或团队>
#   operations: <人或团队>
#   engineering: <人或团队>
#   quality: <人或团队>
artifact_root: .                   # state.yaml 与 .sdlc/ 的根
mcp_adapters: []                   # 经理警告清单 ONLY——不改任何帽子 YAML 的 tools。
  # 要给帽子真正加 MCP 工具：编辑插件 adapters/extra-tools.json（编译期白名单）后重渲染 agents。
  # schema = name + hats + skill，例如：
  # - name: playwright        # 与已连接 MCP server 名精确匹配
  #   hats: [designer, frontend, qa]
  #   skill: design-contract
lane_rules:
  file_count_threshold: 20
  subproject_dirs: []
  schema_paths: []                 # 命中触发 Q1
  auth_paths: []                   # 命中触发 Q2
  ui_paths: []                     # 命中触发 Q-ui（如 frontend/, web/, app/）；check_config.py 会列出检测到的 UI 目录
  tracking_paths: []               # 命中触发 Q-tracking（如 src/analytics/）
# extra_gates: []                  # 可选 layering / frontend / explain / contract。默认不跑（按项目实际栈显式开启，避免无对应目录/契约文件时假红）
# layering_root: backend           # 相对本文件所在项目根；仅当 extra_gates 含 layering 时生效
# frontend_root: frontend          # 相对本文件所在项目根；仅当 extra_gates 含 frontend 时生效
# contract_spec: openapi.yaml      # 相对项目根（或功能契约路径）；仅当 extra_gates 含 contract 时由 skills/architecture/scripts/check-contract.py 校验契约规范与破坏性变更
