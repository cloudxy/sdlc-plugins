# state.yaml 模板——进度唯一事实源（角色只读；经理在任务返回后更新）
feature: <feature-name>
sdlc_version: 4       # v4 闸门（产品层 / 设计方向 / 联调 / E2E / 三方验收 / 回写）只对写了本键的功能生效
product_root: docs/product   # 产品层目录（相对项目根，或绝对路径）；来自 sdlc.config.yaml
delivery_goal: local_verified # proposal_ready|local_verified|release_ready|deployed；不是泳道完成豁免
project_profile: {}   # 实际surface/stack/maturity及数据、安全、发布约束
# 新任务须由经理显式选择，参照 references/task-protocol.md 与 work-scope.md；不要直接取消注释空表。
# task_protocol: 1
# required_capabilities: [input-contract-v1, result-v1, task-closure-v1, work-scope-v1]
# active_work: <work-id> # 裸 continue 的恢复指针；局部完成后清空，不自动开始后续阶段
# work_items: [] # 按 references/work-scope.md 填非空块式记录；完成的是本次工作，不是整个功能
selected_tasks: []    # legacy 初始值；protocol 1 必须为非空块式任务映射，包含 selection/depends_on/gate_stage
# obligations: []     # protocol 1 未决义务；blocker 由独立 resolution 记录解除，不能修改旧 result
lane: L2              # L0-L4（L0 免 state.yaml，用 commit trailer lane=L0）
appetite: 4h          # L2+ 必填；超 50% 停下重判泳道
ui: yes               # Q-ui：有用户可见界面 → designer（explore/specify/accept）+ E2E + 设计走查
tracking: yes         # Q-tracking：新增/变更埋点或指标 → 01-define/tracking.md；no 时 spec 写「埋点：N/A（理由）」
current_hat: define   # 英文主词（define/signals/shape/implement/verify/accept/review/qc/deliver/retro/collect）；发现带不写进 hats_done
hats_done: []         # 英文主词；gates[] fresh-context 建议带 stage: <stage-id>（HATADVANCE 返工判定用）

phase: HatReady       # 持久枚举 Intent|Discovering|LaneJudge|HatReady|Spawned|Rework|HatDone|Closed|Stopped|Refused|L0done
                      # 瞬时步（DiskCheck/ScriptGate/Fresh）跑完即丢，禁止写入。check-sdlc.sh 在 Closed 时检查完整关闭条件。
path: default         # 经理信号 default|short；单独不构成 skip_shape（仍须 L2-short 谓词 (a)/(b)）
intent:
  class: new-feature  # L0|single-hat|refine|fix|review-only|product|eval|resume|discovery|new-feature|out-of-slice
  quote: ""           # 用户最近一条实质性消息（≤200 字）
  skip_shape: false   # true 仅当 (a) contract.md 已在磁盘，或 (b) 实现帽以 spec 替代合同
  skip_discover: false  # 单独不够；记录现有授权/合同/缺陷证据，以及无需进一步探索的原因
  at: ""

discovery:
  status: pending     # pending|done|skipped|killed
  skip_why: ""        # status: skipped 时必填（L2+ 闸门检查）：复用的授权/合同/缺陷证据，以及不需要再探索的原因
  briefing: 00-discover/briefing.md
  tracks:
    discuss: pending  # pending|done|skipped
    compete: pending
    market: pending
    growth: pending   # 增长运营：定位 / 亮点假设（v4）
    falsify: pending
  at: ""              # iso8601

design:               # ui: yes 时由经理在「设计方向选择」人工决策点后记账
  directions: 0       # designer explore 交付的实际采用/比较的方向数（按复用/探索范围）
  picked: ""          # D1|D2|D3…
  picked_by: ""       # user|delegated（用户授权沿用设计师推荐）
  at: ""

roles_skipped: []     # 单行 flow 列表（[architect, growth]），精确 token；block-style 无效。`product-ops` ≡ `ops`（跳过别名，不是 spawn type）
roles_skipped_why: {} # 每个跳过的角色一条理由，如 {growth: "内部工具，无对外宣称"}；v4 缺理由 = SKIPWHY；ui: yes 不能跳过 designer
q_security: no        # yes 当 Q2|Q3|Q4；此时 02-shape/contract.md 须含 [SEC-n]

tickets: []           # [{id, title, journey: J-n, roles: [backend, frontend], status: todo|doing|done|blocked, evidence, integration}]

gates: []             # 三类记录：
  # script:      {name, kind: script, stage: <stage-id>, result: pass|fail, cmd, exit_code, at}   # E2E 记为 name: e2e
  #              带 stage 的脚本闸门失败后，没有重跑并记 pass 就推进 current_hat = HATADVANCE
  # fresh-context:{name, kind: fresh-context, stage: <stage-id>, result, findings_total, blocker: 0, major: 0,
  #                minor: {fixed: 0, waived: 0}, root_cause: <一行，同帽第二轮起必填>, at}
  # self-review: {name, kind: self-review, decision, duration_min, at}
  # 未配置闸门:  {name: <gate>, result: null, reason: <为什么没有>}   # ui: yes 时 e2e 不得为 null

acceptance: []        # [{by: pm|designer|growth, verdict: 通过|有条件通过|不通过, file: 04-verify/accept-<by>.md, at}]
review_findings: []   # [{id, severity, status: fixed|waived, reason?}]
                      # status:fixed 仅在后续 G-fresh 独立核对后写；producer 变更表不是闸门
stale_artifacts: []   # 上游变更导致失效的下游工件
open_questions: []    # 必须含 spec/briefing 里「待确认」的 Q-* ；空数组而仍待确认 = OPENQ
                      # 推荐 {id, class: 战略|运营, status: open|answered|external, owner, recommended: <帽子的推荐>}；纯字符串视为 open
                      # id 按全名精确匹配（Q-PRICE、Q-1 都可；Q-TIER-B 的回答不算 Q-TIER 的）；flow 与块式写法闸门都认
                      # 战略决策 answered 必须带 quote: "<操作者原话>", by: user, at；没回答 = open（沉默不是同意）
                      # 由他人决定、操作者转达时另记 decided_by: <决定者>, relayed_by: user, authority: <为何有权决定>；
                      # 闸门只检查会话里记录的原话，不核验身份：写明「据操作者转达」，不要写成已核实
                      # status≠answered 且 current_hat 已过 define = OPENQOPEN
lane_changes: []      # [{from, to, reason, at}]
# bet:                 # 带赌注的功能：关闭时由 scripts/outcomes.py record 写入结果记录，到期未读数会在 /sdlc 开头提醒
#   hypothesis: H-<n>  # 产品策略 §7 的假设编号
#   metric: <metric_id>
#   evidence_grade: E1 # 下注时关键假设的证据等级（E0-E4），用于统计各等级的命中率
#   readout_due: <YYYY-MM-DD>
# escape:              # 缺陷修复：这个缺陷从哪里逃出来
#   origin_feature: <feature>
#   origin_release: <版本或日期>
#   should_have_caught_at: <define|shape|implement|verify|accept|review|collect|warehouse>
#   gate: <闸门标签、fresh-context、accept 或 none>
#   defect_class: <code|data-definition|tracking|config|requirement>
# host_spawn:          # 缺省不要写 host_spawn: {} —— 整文件重写会覆盖已有回退记录
#   researcher:
#     requested: sdlc-workflow:researcher
#     available: [sdlc-workflow:researcher]
#     fallback: general-purpose
#     reason: "host has no pluginName:bareName table"
rework_rounds: 0      # legacy 连续质量失败计数；scoped work 使用任务级计数，普通反馈迭代不计入
