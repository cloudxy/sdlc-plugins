# sdlc:unfilled — data-warehouse-engineer 写入本产品真实标签体系后删除本行
# tags.yaml — 用户标签体系（SVOT 单一真相版本，产品层 data/tags.yaml；负责人 data-warehouse-engineer；消费者 growth / miner / analyst）
# 规则：每个标签都能由 tracking-plan 事件或业务表计算；写清 logic、effective_from、time_semantics、refresh、owner、privacy 与 consumers。
# 类型：fact（事实，直接统计）· rule（规则组合）· model（模型预测，需关联 model card 且无穿越泄漏）
version: 1
entity: user                     # 标签挂在谁身上：user / tenant / device
privacy_classes:
  public: 可用于展示与任何合规触达
  operational: 可用于已授权业务分群与精准触达（仅输出分档/布尔标签，不向外暴露原始金额或敏感明细）
  internal: 仅内部分析或过滤排除，严禁用于主动营销触达
  sensitive: 敏感属性，需单独合规授权，严禁用于营销触达
tags:
  - id: lifecycle_stage
    type: rule
    values: [new_unactivated, activated, active, dormant_14d, churned_60d, reactivated]
    logic: |
      new_unactivated: signed_up 且未发生 report_viewed
      activated: 首次 report_viewed 发生在注册后 7 天内
      active: 近 7 天有 report_viewed
      dormant_14d: 已激活且 14 天无任何事件
      churned_60d: 60 天无任何事件
      reactivated: churned_60d 之后再次出现 report_viewed
    source_events: [user_signed_up, report_viewed]
    time_semantics: event_time
    effective_from: "2026-09-01"
    refresh: daily
    owner: data-warehouse-engineer
    privacy: public
    consumers: [growth, analyst]

  - id: rfm_value_segment
    type: rule
    values: [high, mid, low]
    logic: 最近一次净付费（R）× 近 90 天净付费次数（F）× 近 90 天净付费金额（M，扣除退款）分位组合
    source_tables: [orders]
    time_semantics: business_time
    effective_from: "2026-09-01"
    refresh: daily
    owner: data-warehouse-engineer
    privacy: operational
    consumers: [growth, analyst]

  - id: churn_risk_30d
    type: model
    values: "0.0-1.0"
    logic: 见 03-impl/mining/model-card.md（miner，严格按 point-in-time 特征窗口计算）；阈值 0.7 以上为高风险召回档
    time_semantics: event_time
    effective_from: "2026-09-01"
    refresh: weekly
    owner: miner
    privacy: operational
    consumers: [growth]

  - id: internal_user
    type: fact
    values: [true, false]
    logic: 邮箱域名属于公司域或在内部账号表中
    source_tables: [users]
    time_semantics: business_time
    effective_from: "2026-09-01"
    refresh: hourly
    owner: data-warehouse-engineer
    privacy: internal
    consumers: [analyst, growth]   # 仅作 exclude 排除过滤，不作触达目标
